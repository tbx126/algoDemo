[project]
name = "algohub-backend"
version = "0.2.0"
description = "AlgoHub real inference, dataset, and evaluation backend (PyTorch + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "lightgbm>=4.7.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu124/"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
